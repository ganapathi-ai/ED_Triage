services:
  - type: web
    name: ed-triage-ai
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt && cd frontend && npm install && npm run build
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
